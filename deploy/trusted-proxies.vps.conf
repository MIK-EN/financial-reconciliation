# Trusted proxy address for the production nginx proxy when Caddy (from
# deploy/compose.vps.yaml) terminates TLS in front of it.
#
# 172.30.50.10 is the pinned address of the Caddy container from
# deploy/compose.vps.yaml (networks.default.ipv4_address).
#
# Caddy overwrites X-Forwarded-For with the real TCP peer address: it ignores
# client-supplied values unless `trusted_proxies` is configured, and we do not
# configure it. So nginx rate limits count real client IPs, and a forged
# X-Forwarded-For cannot bypass them.
set_real_ip_from 172.30.50.10;
