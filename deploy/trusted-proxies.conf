# Trusted proxy addresses for the production nginx proxy.
#
# This file is included from deploy/nginx.conf (as
# /etc/nginx/trusted-proxies.conf) right before:
#
#     real_ip_header X-Forwarded-For;
#     real_ip_recursive on;
#
# By default it trusts NOTHING: with no `set_real_ip_from` line, the client
# address used for rate limiting and X-Forwarded-For is the TCP peer address
# (i.e. the direct connection to nginx).
#
# Only when the proxy runs behind another trusted hop (for example a
# load balancer or tunnel on the same host), add its address or CIDR here,
# one per line, e.g.:
#
#     set_real_ip_from 203.0.113.10;
#     set_real_ip_from 10.0.0.0/8;
#
# Never add a range you do not control: anything listed here can spoof its
# own client address through X-Forwarded-For.
