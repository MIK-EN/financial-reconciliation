# ---------------------------------------------------------------------------
# English for Developers - production reverse proxy.
#
# This file is an http-level conf.d fragment: the stock nginx.conf includes
# /etc/nginx/conf.d/*.conf inside its `http` block, so http-level directives
# (resolver, map, limit_req_zone, log_format) are allowed here.
#
# TLS and the public host name are out of scope: the proxy listens on plain
# HTTP and deploy/compose.production.yaml binds it to 127.0.0.1.
# ---------------------------------------------------------------------------

# Resolve the backend at request time through Docker's embedded DNS, so nginx
# keeps running (and keeps serving) across backend container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

# Client address handling. The include comes first: by default it contains
# comments only, so NO proxy is trusted and the TCP peer address is used.
# Add `set_real_ip_from <addr>;` lines to deploy/trusted-proxies.conf to
# trust an upstream proxy.
include /etc/nginx/trusted-proxies.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limiting is keyed on the client address and only applies to POST:
# every other method maps to the empty key, which is never accounted.
map $request_method $post_limit_key {
    default "";
    POST    $binary_remote_addr;
}

# login + register share one zone: 5 requests / minute per IP across both.
limit_req_zone $post_limit_key zone=auth_zone:10m rate=5r/m;
# browser-session + onboarding share one zone: 10 requests / minute per IP.
limit_req_zone $post_limit_key zone=start_zone:10m rate=10r/m;

limit_req_status 429;
limit_req_log_level warn;

# Restrictive access log: no URI, query string, cookies, referer, user agent
# or client address. Only the upstream request id links a line to a request.
log_format safe '$time_iso8601 $request_method $status $request_time rid=$upstream_http_x_request_id';

server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Declared at server level (overrides the image defaults) so the `safe`
    # format is the only access log and errors go to stderr.
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;

    client_max_body_size 16k;

    # Security headers on every response. `add_header` in a location replaces
    # the inherited set, so locations that add their own header repeat these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # JSON error bodies for the two nginx-generated client errors.
    error_page 429 = @rate_limited;
    error_page 413 = @too_large;

    # Container healthcheck endpoint.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build assets: immutable, cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # The SPA shell must always be revalidated; `location /` below falls back
    # to it, and the internal redirect lands here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Static frontend with SPA fallback.
    location / {
        try_files $uri /index.html;
    }

    # --- API proxy ---------------------------------------------------------
    # proxy_pass uses a variable, so the URI is resolved at request time and
    # the original request URI is forwarded unchanged (no URI part here).
    # Response headers (Cache-Control: no-store, Set-Cookie, X-Request-ID)
    # pass through untouched; no caching is configured.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append, anything the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not forward client-supplied request ids.
        proxy_set_header X-Request-ID "";
        proxy_read_timeout 30s;
    }

    # --- Rate-limited routes ----------------------------------------------
    # These exact-match locations win over `location /api/`, so they repeat
    # the minimal proxy directives (a nested location does not inherit them).
    # login + register share auth_zone: 5/min per IP plus burst 5.

    location = /api/v1/auth/login {
        limit_req zone=auth_zone burst=5 nodelay;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID "";
        proxy_read_timeout 30s;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_zone burst=5 nodelay;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID "";
        proxy_read_timeout 30s;
    }

    # browser-session + onboarding share start_zone: 10/min per IP plus
    # burst 5. Only the POST routes that create state are limited; the
    # onboarding answers/claim sub-routes and PUT selections are not.
    location = /api/v1/browser-session {
        limit_req zone=start_zone burst=5 nodelay;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID "";
        proxy_read_timeout 30s;
    }

    location = /api/v1/onboarding {
        limit_req zone=start_zone burst=5 nodelay;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID "";
        proxy_read_timeout 30s;
    }

    # --- nginx-generated error bodies -------------------------------------

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        return 429 '{"code":"rate_limited","message":"Too many requests"}';
    }

    location @too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        return 413 '{"code":"request_too_large","message":"Request body is too large"}';
    }
}
